<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon Municipalidad de Tafí del Valle: cerros, valle, sol y menhir, con la paleta del escudo institucional -->
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- Cielo -->
    <rect width="64" height="64" fill="#2274b5"/>
    <!-- Sol -->
    <circle cx="46" cy="16" r="8" fill="#f2c14e"/>
    <!-- Cerros (marrón del escudo) -->
    <path d="M-4 46 L17 18 L31 38 L43 26 L68 50 V68 H-4 Z" fill="#95603c"/>
    <!-- Nieve en el cerro mayor -->
    <path d="M17 18 L23 26 L20 25 L17 28 L14 25 L11 26 Z" fill="#ffffff"/>
    <!-- Valle (verde del escudo) -->
    <path d="M-4 50 Q14 41 32 46 Q50 51 68 44 V68 H-4 Z" fill="#4b9b8e"/>
    <!-- Menhir -->
    <path d="M30 60 C29 52 29.5 44 32 41 C34.5 44 35 52 34 60 Z" fill="#6b7280"/>
  </g>
</svg>
